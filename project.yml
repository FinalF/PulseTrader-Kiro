name: DayTrader
options:
  bundleIdPrefix: com.daytrader
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.daytrader.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # fill in your Team ID before archiving
    INFOPLIST_FILE: DayTrader/Resources/Info.plist

targets:
  DayTrader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DayTrader
        excludes:
          - "**/*.md"
    resources:
      - path: DayTrader/Resources/Info.plist
    settings:
      base:
        INFOPLIST_FILE: DayTrader/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.daytrader.app
    dependencies: []

  DayTraderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DayTraderTests
    dependencies:
      - target: DayTrader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daytrader.tests

schemes:
  DayTrader:
    build:
      targets:
        DayTrader: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: DayTraderTests
          parallelizable: true
    profile:
      config: Release
    archive:
      config: Release
